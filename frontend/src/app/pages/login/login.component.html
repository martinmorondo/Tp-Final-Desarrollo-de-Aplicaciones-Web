<div class="contenedor">
  <h1>Clínica - Iniciar sesión</h1>

  <form (ngSubmit)="ingresar()">
    <label>
      Correo electrónico
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="username"
        required
      />
    </label>

    <label>
      Contraseña
      <input
        type="password"
        name="clave"
        [(ngModel)]="clave"
        autocomplete="current-password"
        required
      />
    </label>

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </form>
</div>
