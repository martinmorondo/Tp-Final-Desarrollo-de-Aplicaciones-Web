<div class="contenedor">
  <h1>Clínica - Iniciar sesión</h1>

  <form (ngSubmit)="ingresar()">
    <label>
      Email
      <input type="text" name="email" [(ngModel)]="email" required />
    </label>

    <label>
      Contraseña
      <input type="password" name="clave" [(ngModel)]="clave" required />
    </label>

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </form>
</div>
